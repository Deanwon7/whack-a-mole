<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101b35">
<title>JIYOON & JIHOON'S MOLE GAME</title>
<style>
:root{color-scheme:dark;--ink:#101b35;--gold:#ffd34e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b35}
body{display:grid;place-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;touch-action:none;overscroll-behavior:none}
#stage{position:relative;width:min(100vw, min(81.08vh, 600px));height:min(100dvh, calc(100vw * 740 / 600));max-width:600px;max-height:740px;aspect-ratio:600/740;overflow:hidden;border-radius:clamp(16px,4vw,28px);box-shadow:0 18px 55px #0009;background:#74b9ff}
canvas{display:block;width:100%;height:100%;touch-action:none}
#rotate{display:none;position:fixed;inset:0;background:#101b35;color:white;z-index:5;place-items:center;text-align:center;padding:24px;font-size:20px;line-height:1.5}
@media (orientation:landscape) and (max-height:520px){#rotate{display:grid}#stage{visibility:hidden}}
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="600" height="740" aria-label="Jiyun and Jihun's Whack-A-Mole Game"></canvas></div>
<div id="rotate">📱<br><br>Please rotate your iPhone<br>to Portrait Mode!</div>
<script>
(()=>{
'use strict';
const W=600,H=740,canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
let state='TITLE',score=0,best=0,combo=0,maxCombo=0,level=1,timeLeft=10;
const GAME_TIME=10; // 플레이 시간 10초로 수정
let last=0,raf=0,spawnIn=.3,shake=0,shakePower=0,muted=false,audio=null;
let particles=[],texts=[];
const holes=[];
for(let r=0;r<3;r++)for(let c=0;c<3;c++)holes.push({x:130+c*170,y:305+r*140,p:0,target:0,type:'normal',hit:false,life:0,anim:0});
const clouds=[{x:70,y:65,s:1,v:12},{x:340,y:105,s:.7,v:8},{x:520,y:45,s:.55,v:15}];

try{best=Number(localStorage.getItem('jjMoleBest')||0)||0}catch(_){best=0}
function saveBest(){try{localStorage.setItem('jjMoleBest',String(best))}catch(_){}}

function sound(kind){
 if(muted)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  if(!audio)audio=new AC();if(audio.state==='suspended')audio.resume();
  const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;
  o.connect(g);g.connect(audio.destination);
  const cfg={hit:[520,880,.10,'sine'],gold:[660,1320,.22,'triangle'],bomb:[180,45,.28,'sawtooth'],start:[523,784,.3,'sine']};
  const [a,b,d,w]=cfg[kind]||cfg.hit;o.type=w;o.frequency.setValueAtTime(a,t);o.frequency.exponentialRampToValueAtTime(b,t+d);
  g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d);
 }catch(_){}
}

function reset(){
 score=0;combo=0;maxCombo=0;level=1;timeLeft=GAME_TIME;spawnIn=.25;shake=0;particles=[];texts=[];
 holes.forEach(h=>{h.p=0;h.target=0;h.hit=false;h.life=0;h.anim=0;h.type='normal'});
}

function start(){
 reset();state='PLAY';sound('start');last=performance.now();
}

function addText(x,y,str,color='#fff',size=22){texts.push({x,y,str,color,size,life:1})}

function burst(x,y,color,n=16){
 for(let i=0;i<n;i++){
  let a=Math.random()*Math.PI*2,v=80+Math.random()*230;
  particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-70,r:3+Math.random()*5,life:.75,color});
 }
}

function hit(h){
 h.hit=true;h.target=0;h.anim=.22;
 const x=h.x,y=h.y-h.p*50;
 if(h.type==='bomb'){
  score=Math.max(0,score-30);combo=0;shake=.32;shakePower=12;sound('bomb');
  burst(x,y,'#ff554f',26);addText(x,y-35,'BOOM! -30','#ff7770',27);
 }else{
  combo++;maxCombo=Math.max(maxCombo,combo);
  const multiplier=combo>=5?2:1;
  const pts=h.type==='gold'?50*multiplier:(10+Math.min(combo*2,20))*multiplier;
  score+=pts;
  if(h.type==='gold'){
   timeLeft=Math.min(GAME_TIME+3,timeLeft+1.0);sound('gold');shake=.15;shakePower=7;
   burst(x,y,'#ffdb45',25);addText(x,y-38,`GOLD +${pts}`,'#fff18a',25);addText(x,y-70,'TIME +1.0s','#fff',16);
  }else{
   sound('hit');shake=.09;shakePower=3;burst(x,y,'#ffe16a',13);
   addText(x,y-30,`+${pts}${multiplier===2?' x2!':''}`,'#fff',23);
  }
  if(combo>=3)addText(x,y-65,`${combo} COMBO!`,'#68ffd2',17);
 }
}

function input(e){
 e.preventDefault();
 const r=canvas.getBoundingClientRect();
 const x=(e.clientX-r.left)*W/r.width;
 const y=(e.clientY-r.top)*H/r.height;

 if(x>=515&&x<=585&&y>=125&&y<=180){
  muted=!muted;
  if(!muted)sound('hit');
  return;
 }

 if(state==='TITLE'||state==='OVER'||state==='PAUSE'){
  if(x>=140&&x<=460&&y>=490&&y<=580){
   start();
  }
  return;
 }

 if(state!=='PLAY')return;

 let found=false;
 for(let i=holes.length-1;i>=0;i--){
  const h=holes[i];
  if(h.p>0.15&&!h.hit){
   const my=h.y+30-h.p*52;
   if(Math.hypot(x-h.x,y-my)<=78){
    hit(h);
    found=true;
    break;
   }
  }
 }

 if(!found){
  if(combo>0){
   combo=0;
   addText(x,y-15,'MISS!','#dfe6e9',16);
  }
 }
}
canvas.addEventListener('pointerdown',input,{passive:false});

function update(dt){
 clouds.forEach(c=>{c.x+=c.v*dt;if(c.x>W+70)c.x=-70});
 if(shake>0)shake=Math.max(0,shake-dt);
 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=520*dt;p.life-=dt});
 particles=particles.filter(p=>p.life>0);
 texts.forEach(t=>{t.y-=42*dt;t.life-=dt*1.15});
 texts=texts.filter(t=>t.life>0);

 if(state!=='PLAY')return;

 timeLeft-=dt;
 if(timeLeft<=0){
  timeLeft=0;
  state='OVER';
  if(score>best){best=score;saveBest()}
  holes.forEach(h=>h.target=0);
  return;
 }

 level=1+Math.floor((GAME_TIME-timeLeft)/4);
 const pace=1+(level-1)*.25;
 spawnIn-=dt;
 if(spawnIn<=0){
  const idle=holes.filter(h=>h.p<.04&&h.target===0);
  if(idle.length){
   const h=idle[Math.floor(Math.random()*idle.length)];
   h.target=1;h.hit=false;h.anim=0;
   const roll=Math.random();
   h.type=roll<.65?'normal':roll<.83?'gold':'bomb';
   h.life=(.8+Math.random()*.3)/pace;
  }
  spawnIn=(.35+Math.random()*.25)/pace;
 }

 holes.forEach(h=>{
  if(h.target){
   h.p+=(1-h.p)*Math.min(1,dt*18*pace);
   h.life-=dt;
   if(h.life<=0)h.target=0;
  }else{
   h.p=Math.max(0,h.p-dt*(h.hit?18:12));
  }
  if(h.anim>0)h.anim=Math.max(0,h.anim-dt);
 });
}

function rounded(x,y,w,h,r,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
}

function drawCloud(c,ox,oy){
 ctx.fillStyle='#fff';ctx.beginPath();
 ctx.arc(c.x+ox,c.y+oy,24*c.s,0,Math.PI*2);
 ctx.arc(c.x-20*c.s+ox,c.y+5*c.s+oy,17*c.s,0,Math.PI*2);
 ctx.arc(c.x+20*c.s+ox,c.y+5*c.s+oy,18*c.s,0,Math.PI*2);
 ctx.fill();
}

function drawMole(h,ox,oy){
 const x=h.x+ox,y=h.y+34-h.p*52+oy, gold=h.type==='gold',bomb=h.type==='bomb';
 ctx.save();ctx.translate(x,y);
 if(bomb){
  ctx.fillStyle='#263238';ctx.beginPath();ctx.arc(0,0,36,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.stroke();
  ctx.font='32px sans-serif';ctx.textAlign='center';ctx.fillText('💣',0,11);
 }else{
  ctx.fillStyle=gold?'#f7c843':'#95603c';ctx.beginPath();ctx.ellipse(0,0,39,44,0,0,Math.PI*2);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=gold?'#b98214':'#603b29';ctx.stroke();
  ctx.fillStyle=gold?'#ffe68a':'#e8b58a';ctx.beginPath();ctx.ellipse(0,12,24,26,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#24212a';
  if(h.hit){
   ctx.strokeStyle='#24212a';ctx.lineWidth=3;
   [-15,15].forEach(a=>{ctx.beginPath();ctx.moveTo(a-5,-19);ctx.lineTo(a+5,-9);ctx.moveTo(a+5,-19);ctx.lineTo(a-5,-9);ctx.stroke()});
  }else{
   ctx.beginPath();ctx.arc(-15,-15,4,0,7);ctx.arc(15,-15,4,0,7);ctx.fill();
  }
  ctx.fillStyle='#f47b83';ctx.beginPath();ctx.arc(0,-3,7,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(-5,5,10,8);
  if(gold){
   ctx.fillStyle='#ff9f43';ctx.beginPath();
   ctx.moveTo(-22,-34);ctx.lineTo(-20,-55);ctx.lineTo(-7,-43);ctx.lineTo(0,-62);ctx.lineTo(8,-43);ctx.lineTo(22,-55);ctx.lineTo(22,-34);
   ctx.fill();
  }
 }
 ctx.restore();
}

function draw(){
 const sx=shake?((Math.random()-.5)*shakePower):0,sy=shake?((Math.random()-.5)*shakePower):0;
 ctx.save();ctx.translate(sx,sy);
 ctx.fillStyle='#74c5ff';ctx.fillRect(0,0,W,220);
 ctx.fillStyle='#a9e1ff';ctx.fillRect(0,155,W,70);
 clouds.forEach(c=>drawCloud(c,sx*.1,sy*.1));
 ctx.fillStyle='#3bc66b';ctx.fillRect(0,205,W,H-205);
 for(let i=0;i<5;i++){ctx.fillStyle=i%2?'#35bd62':'#48d477';ctx.fillRect(0,235+i*100,W,48)}
 ctx.fillStyle='#a85e2b';ctx.fillRect(0,197,W,13);

 holes.forEach(h=>{
  ctx.fillStyle='#432616';ctx.beginPath();ctx.ellipse(h.x,h.y,57,23,0,0,7);ctx.fill();
  ctx.strokeStyle='#714322';ctx.lineWidth=4;ctx.stroke();
 });
 holes.forEach(h=>{if(h.p>.01)drawMole(h,sx,sy)});
 holes.forEach(h=>{
  ctx.fillStyle='#80502d';ctx.beginPath();ctx.ellipse(h.x,h.y+5,57,17,0,0,Math.PI);ctx.fill();
  ctx.strokeStyle='#57351f';ctx.lineWidth=4;ctx.stroke();
 });

 particles.forEach(p=>{
  ctx.globalAlpha=Math.max(0,p.life/.75);ctx.fillStyle=p.color;
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
 });
 ctx.globalAlpha=1;

 texts.forEach(t=>{
  ctx.globalAlpha=Math.max(0,t.life);ctx.textAlign='center';
  ctx.font=`900 ${t.size}px -apple-system,sans-serif`;
  ctx.lineWidth=4;ctx.strokeStyle='#252b38';ctx.strokeText(t.str,t.x,t.y);
  ctx.fillStyle=t.color;ctx.fillText(t.str,t.x,t.y);
 });
 ctx.globalAlpha=1;
 ctx.restore();

 // 둥근 HUD 디자인
 rounded(14,13,572,105,24,'#17243a');
 ctx.strokeStyle='#40516d';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(15,14,570,103,22);ctx.stroke();

 ctx.textAlign='left';ctx.font='bold 13px sans-serif';ctx.fillStyle='#9eafc7';ctx.fillText('SCORE',34,39);
 ctx.font='900 29px sans-serif';ctx.fillStyle='#ffd34e';ctx.fillText(score.toLocaleString(),34,75);

 ctx.textAlign='right';ctx.font='bold 13px sans-serif';ctx.fillStyle='#9eafc7';ctx.fillText('BEST',565,39);
 ctx.font='900 24px sans-serif';ctx.fillStyle='#fff';ctx.fillText(best.toLocaleString(),565,75);

 ctx.textAlign='center';
 if(combo>=2){
  ctx.font='900 19px sans-serif';ctx.fillStyle=combo>=5?'#ff7979':'#61ffd0';
  ctx.fillText(`${combo} COMBO${combo>=5?'  x2':''}`,300,54);
 }

 rounded(34,89,532,17,8,'#35445c');
 rounded(36,91,528*Math.max(0,timeLeft/GAME_TIME),13,6,timeLeft<3?'#ff5555':'#20d68a');

 ctx.font='bold 11px sans-serif';ctx.fillStyle='#fff';
 ctx.fillText(`TIME ${timeLeft.toFixed(1)}s   •   LEVEL ${level}`,300,103);

 if(state!=='PLAY')overlay();

 rounded(530,130,48,42,16,'#17243acc');
 ctx.font='22px sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff';
 ctx.fillText(muted?'🔇':'🔊',554,159);
}

function overlay(){
 ctx.fillStyle='#071225a8';ctx.fillRect(0,0,W,H);
 rounded(65,175,470,450,32,'#17243a');
 ctx.strokeStyle='#ffd34e';ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(67,177,466,446,30);ctx.stroke();

 ctx.textAlign='center';
 if(state==='TITLE'){
  ctx.font='900 32px sans-serif';ctx.fillStyle='#ffd34e';ctx.fillText("JIYUN & JIHUN'S",300,240);
  ctx.font='900 28px sans-serif';ctx.fillStyle='#fff';ctx.fillText("WHACK-A-MOLE",300,280);

  ctx.font='bold 15px sans-serif';ctx.fillStyle='#dce7f5';
  ctx.fillText('🐹 Normal Mole : +Score',300,345);
  ctx.fillText('👑 Golden Mole : +50Pts & +Time',300,380);
  ctx.fillText('💣 Bomb Mole : -30Pts & Reset Combo',300,415);
  ctx.font='14px sans-serif';ctx.fillStyle='#9fb1c9';ctx.fillText('5 Combo+ gives Double Score!',300,455);
 }else if(state==='OVER'){
  ctx.font='900 37px sans-serif';ctx.fillStyle='#ff7373';ctx.fillText('TIME OVER!',300,260);
  ctx.font='900 30px sans-serif';ctx.fillStyle='#ffd34e';ctx.fillText(`SCORE  ${score.toLocaleString()}`,300,335);
  ctx.font='bold 18px sans-serif';ctx.fillStyle='#fff';ctx.fillText(`BEST ${best.toLocaleString()}   ·   MAX COMBO ${maxCombo}`,300,390);
  ctx.font='16px sans-serif';ctx.fillStyle='#c5d3e6';ctx.fillText(score>=best&&score>0?'New High Score! 🎉':'Great Job!',300,435);
 }else if(state==='PAUSE'){
  ctx.font='900 38px sans-serif';ctx.fillStyle='#fff';ctx.fillText('PAUSED',300,300);
  ctx.font='17px sans-serif';ctx.fillStyle='#c5d3e6';ctx.fillText('Tap screen to resume',300,365);
 }

 rounded(145,505,310,76,24,'#12bd78');
 ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(146,506,308,74,22);ctx.stroke();

 ctx.font='900 24px sans-serif';ctx.fillStyle='#fff';
 ctx.fillText(state==='TITLE'?'GAME START!':state==='OVER'?'PLAY AGAIN':'RESUME',300,552);
}

document.addEventListener('visibilitychange',()=>{
 if(document.hidden){if(state==='PLAY')state='PAUSE';}
 else{last=performance.now();if(state==='PAUSE')state='PLAY';}
});
window.addEventListener('pagehide',()=>{if(raf)cancelAnimationFrame(raf)});

function loop(ts){
 let dt=Math.min(.033,Math.max(0,(ts-last)/1000||0));
 last=ts;
 update(dt);
 draw();
 raf=requestAnimationFrame(loop);
}

last=performance.now();
raf=requestAnimationFrame(loop);
})();
</script>
</body>
</html>
